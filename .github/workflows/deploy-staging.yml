name: Deploy CI/CD App to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_APP_PATH }}

            echo "📥 Pulling latest staging code"
            git fetch origin
            git checkout staging
            git pull origin staging

            echo "📦 Installing dependencies"
            npm ci

            echo "🏗 Building app"
            npm run build

            echo "Exporting NODE_ENV Variable for ecosystem.config.js file"
            export NODE_ENV=staging
            
            echo "🚀 Restarting PM2 via ecosystem.config.js staging"
            pm2 reload ecosystem.config.js --env staging || pm2 start ecosystem.config.js --env staging
            pm2 save
